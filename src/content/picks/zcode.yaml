whatItDoes: >-
  ZCode is an AI coding workspace from Z.ai (formerly Zhipu AI), built around its GLM models. Its agent plans
  a task, edits files, runs checks and keeps going towards the goal you describe, and by default it asks
  before sensitive actions. It can also use models from other companies, such as Anthropic and OpenAI, and you
  can steer a running job from your phone through WeChat, Feishu or Telegram. The app launched in July 2026.
  This repository holds the source code for the desktop app, the browser view, the server and the terminal
  agent.
howToUse:
  shell: PowerShell (Windows 11)
  steps:
    - text: >-
        Install Git, Node.js 24.14.0 and pnpm 10.33.2 (the versions the README pins), then download the code.
      code: |-
        git clone https://github.com/zai-org/ZCode.git
        cd ZCode
    - text: Install everything and prepare the desktop app.
      code: pnpm bootstrap
    - text: Start the desktop app from source.
      code: pnpm dev:desktop
    - text: >-
        If you build the command-line version, its browser view listens only on your own PC (127.0.0.1) by
        default. Check which zcode command Windows is using.
      code: |-
        zcode --web
        where.exe zcode
bestPractices:
  - Keep the browser view on 127.0.0.1. If you open it to your network with --host 0.0.0.0, keep the access
    token switched on.
  - Keep the default that makes the agent ask before sensitive actions, so it can't delete or run risky things
    without you.
  - Know the cost before you connect a paid plan. Techzine reported in July 2026 that the GLM Coding Plan cost
    $16.20 to $144 a month; check current prices on Z.ai's site.
  - Bring-your-own-key models bill to your account. Store keys in environment variables, never in project
    files.
