name: Harness²
repo: google-research/harness2
tagline: Google Research's tool that lets an AI helper rewrite its own instructions and tools to do a task
  better, without retraining.
category: agents
license: Apache-2.0
stars: 23815
statsCheckedOn: 2026-11-14
createdOn: 2026-10-06
addedOn: 2026-11-08
whatItDoes: >-
  An AI agent is more than its model. Around it sits a "harness": the instructions, tools, memory, skills and
  helpers that let it act. Harness² improves that harness and leaves the model untouched. For each task it
  proposes changes, tries them side by side, and keeps only the changes that made a visible difference. It
  also keeps notes so the next task starts from what worked. Google reports gains of up to 11.5 points on
  WorkBuddy-Bench, 4.5 points on JobBench and 11.8 percentage points on the legal benchmark LAB. These are the
  authors' own figures. It is a research project, not an officially supported Google product.
howToUse:
  shell: Ubuntu (bash) in WSL on Windows 11
  steps:
    - text: >-
        Harness² needs Linux, Python 3.12 and uv. On Windows 11, install WSL with Ubuntu from an administrator
        PowerShell window, restart, then open Ubuntu. Install uv by following its official guide.
      code: wsl --install -d Ubuntu
    - text: Download the project and set up a Python 3.12 environment.
      code: |-
        git clone https://github.com/google-research/harness2.git
        cd harness2
        uv venv --python 3.12 .venv
        source .venv/bin/activate
        uv pip install -e '.[render]'
    - text: >-
        Run the free local demo. It tries both ways of improving a harness with real Python runs and needs no
        model account.
      code: harness2-demo --output runs/demo --k 2
    - text: >-
        Before a real benchmark, install one (LAB, a set of legal tasks) and preview which tasks it would
        pick, without calling any model.
      code: |-
        harness2-setup lab
        harness2 --bench lab --k 1 --mode parallel --only-domains antitrust-competition --max-tasks 1 --dry-run
bestPractices:
  - Start with the demo. Real benchmark runs call paid models, and each round of improvement means more test
    runs and more model calls.
  - Limit network access before real runs. The README warns that the default agent has open internet access
    and the Codex option turns its sandbox off.
  - Keep model keys in the .env file the README describes, and never commit that file.
  - Treat the reported gains as the authors' claims until you reproduce them on your own tasks.
