name: Ollama
repo: ollama/ollama
tagline: Download and chat with open AI models on your own PC with one command, no cloud account needed.
category: run-models
license: MIT
stars: 186320
statsCheckedOn: 2026-11-08
addedOn: 2026-11-06
whatItDoes: >-
  Ollama is a small app that downloads open-weight language models (Llama, Gemma, Mistral, Qwen and others)
  and runs them on your own computer. It gives you a chat in the terminal and a local API on port 11434, so
  other apps can use the model as if it were a cloud service. Nothing you type leaves your machine.
howToUse:
  shell: PowerShell (Windows 11)
  steps:
    - text: Install it with winget, or download the Windows installer from ollama.com.
      code: winget install Ollama.Ollama
    - text: Download a small model and start chatting. Type /bye to quit.
      code: ollama run llama3.2
    - text: Call the same model from any script through the local API.
      code: |-
        Invoke-RestMethod http://localhost:11434/api/generate -Method Post -Body '{"model":"llama3.2","prompt":"Explain DNS in one line","stream":false}' | Select-Object -ExpandProperty response
    - text: List and remove models to free disk space.
      code: |-
        ollama list
        ollama rm llama3.2
bestPractices:
  - Pick a model that fits your memory. A 3B model runs on most laptops; 7-8B models want about 8 GB of free
    RAM or VRAM.
  - Keep the API on localhost. Never open port 11434 to the internet, because it has no login by default.
  - Pin a model tag (for example llama3.2:3b) in scripts so an update doesn't silently change your results.
  - Check each model's licence on its library page before using it in a commercial product.
